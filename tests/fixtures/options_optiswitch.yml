---
# Indicates the style of the configuration
style: optiswitch

negation: "no"

# if there is a delta, negate the parents and re-write the parents with children
sectional_overwrite: []

# if there is a delta, overwrite these parents instead of one of their children
sectional_overwrite_no_negate: []

# The default order value is 500, with a range between 1 - 999.
# Commands with smaller order values float to the top in the order of execution.
# Commands with larger order values float to the bottom in the order of execution.
# Syntax Example:
# - lineage:
#   - startswith:
#     - no route-map
#   order: 600
ordering:
- lineage:
  - startswith:
    - no port access-group
  order: 10

# adds +1 indent to lines following start_expression and removes the +1 indent for lines following end_expression
indent_adjust: []

parent_allows_duplicate_child: []

# This rule is used in the hierarchical_configuration unit test for .add_section_exiting()
# - lineage:
#   - startswith: router bgp
#   - startswith: template peer-policy
#   exit_text: exit-peer-policy
sectional_exiting:
- lineage:
  - startswith: traffic-manager
  - startswith: tm-port
  exit_text: tm-enable

# Add back to end of each section.
default_sectional_exiting: False

# substitions against the full multi-line config text
full_text_sub: []
#- search: 'banner\s(exec|motd)\s(\S)\n(.*\n){1,}(\2)'
#  replace: ''
#- search: 'banner\s(exec|motd)\s(\S.).+\n(.*\n){1,}.*(\2)'
#  replace: ''
#- search: 'banner\s(exec|motd)\s(\S.)\n(.*\n){1,}(\2)'
#  replace: ''

# substitions against each line of the config text
per_line_sub: []

idempotent_commands_blacklist: []

# These commands do not require negation, they simply overwrite themselves
idempotent_commands:
- lineage:
  - startswith: lldp
  - startswith: port
- lineage:
  - startswith: ethernet oam
  - startswith: service
  - startswith:
    - name
    - remote-meps
- lineage:
  - startswith: hostname
- lineage:
  - startswith: snmp
  - startswith: location
- lineage:
  - startswith: port description
- lineage:
  - startswith: interface
  - startswith: name
- lineage:
  - startswith: traffic-manager
  - startswith: tm-port
  - startswith: service-node
  - startswith: rate


# Default when expression: list of expressions
negation_default_when: []

# Negate substitutions: expression -> negate with
negation_negate_with:
- lineage:
  - startswith: interface
  - startswith: rfc2544 mac-to-responder
  use: no rfc2544 mac-to-responder




# Negate expressions with replace: lineage expression -> negate replace
# Use search and replace options to find and replace some line expression
negation_replace:
- lineage:
  - startswith: radius-server
  search: (radius-server host \S+) .*
  replace: 'no \1 '
- lineage:
  - startswith: snmp
  search: (community \d+) .*
  replace: 'no \1 '
- lineage:
  - startswith: snmp
  search: (trapsess \S+) .*
  replace: 'no \1 '
- lineage:
  - startswith: port flood-limiting
  search: port flood-limiting (\S+).*(\S+)$
  replace: 'no port flood-limiting \1 \2'
- lineage:
  - startswith: port access-group egress
  search: port access-group egress \S+ (\S+)
  replace: 'no port access-group egress \1'
- lineage:
  - startswith: traffic-manager
  - startswith: tm-port
  search: tm-port (\d)
  replace: |
    tm-port \1
        no service-node 1
        no service-node 2
        no service-node 3
        no service-node 4
        no service-node 5
        no service-node 6
        no service-node 7
        no service-node 8
        no service-node 9
        no service-node 10
        exit
      no tm-port \1


rewrite_rules: []
